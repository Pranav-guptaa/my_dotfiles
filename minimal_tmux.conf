# Reloading Tmux configuration - <prefix> + r
unbind r
bind r source-file ~/.tmux.conf \; display-message "Tmux Reloaded"

# Setting prefix to tick (`)
set -g prefix `
bind ` send-prefix

# Moving between panes using <prefix> + h,j,k,l
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Setting history limit to maximum
set -g history-limit 1000000

# Setting mouse on
set -g mouse on

set -g default-terminal "xterm-256color"

# Ensure window titles get renamed automatically.
setw -g automatic-rename on

# Renaming the window manually using F8
bind-key -n F8 command-prompt -I "#W" "rename-window '%%'"

# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on

# Start windows and panes index at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1

# Unbind default keys
unbind C-b
unbind '"'
unbind %

# Resize pane using Shift + Arrow
bind-key -n S-Left resize-pane -L
bind-key -n S-Right resize-pane -R
bind-key -n S-Up resize-pane -U
bind-key -n S-Down resize-pane -D

# Maintain present working directory
bind c new-window -c "#{pane_current_path}"

# Split panes.
bind-key b split-window -v -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"

# Move around panes with ALT + arrow keys.
bind-key -n M-Up select-pane -U
bind-key -n M-Left select-pane -L
bind-key -n M-Down select-pane -D
bind-key -n M-Right select-pane -R

# ---- Status bar: dark theme matching terminal, cyan/green accents ----
set -g status-position bottom
set -g status-style "bg=#1e222a,fg=#c0c5ce"
set -g status-justify centre

# Left side: session name, cyan accent block
set -g status-left "#[bg=#88c0d0,fg=#1e222a,bold] #S #[bg=#1e222a,fg=#88c0d0]"
set -g status-left-length 20

# Window list (centered, since status-justify is centre)
setw -g window-status-current-format "#[fg=#a3be8c,bold][#I:#W]"
setw -g window-status-format "#[fg=#c0c5ce]#I:#W"

# Right side: wlan0 IP + battery % + time, green/cyan accents
set -g status-right "#[fg=#88c0d0]#(ip -4 addr show exploitad 2>/dev/null | awk '/inet /{print $2}' | cut -d/ -f1) #[fg=#4b5263]| #[fg=#a3be8c]#(acpi -b 2>/dev/null | grep -Po '[0-9]+(?=%)' | head -1)%% #[fg=#4b5263]| #[fg=#88c0d0]%H:%M "
set -g status-right-length 60

# Refresh interval so IP/battery update periodically
set -g status-interval 5

# Copy to system clipboard - keyboard: prefix+[ enter copy mode, v select, y yank
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# Copy to system clipboard - mouse: click-drag, release to copy
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

set -sg escape-time 50
